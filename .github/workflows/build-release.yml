name: Build OpenRecon release

on:
  workflow_dispatch:
    inputs:
      container:
        description: Container to build
        required: true
        type: choice
        default: bios214-radial
        options:
          - bios214-radial

permissions:
  contents: write
  packages: write

concurrency:
  group: openrecon-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.17'
      - name: Prepare build space and packaging tools
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y p7zip-full jq
          df -h /
      - name: Check version is unused
        env:
          GH_TOKEN: ${{ github.token }}
          CONTAINER: ${{ inputs.container }}
        run: |
          set -euo pipefail
          source "containers/$CONTAINER/params.sh"
          tag="openrecon-${toolName}-v${version}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${CONTAINER}:${version}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
             docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "Version $version is already published. Bump the container version before rebuilding." >&2
            exit 1
          fi
      - name: Build scanner package
        env:
          CONTAINER: ${{ inputs.container }}
        run: bash package.sh "$CONTAINER"
      - name: Publish scanner image to GHCR
        id: ghcr
        env:
          GH_TOKEN: ${{ github.token }}
          CONTAINER: ${{ inputs.container }}
        run: |
          set -euo pipefail
          source "containers/$CONTAINER/params.sh"
          vendor=$(jq -r '.general.vendor' "containers/$CONTAINER/OpenReconLabel.json")
          source_image="openrecon_${vendor}_${toolName}:v${version}"
          source_image="${source_image,,}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${CONTAINER}:${version}"
          7z x -so "dist/$CONTAINER/"*.zip '*.tar' | docker load
          docker tag "$source_image" "$image"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Publish ZIP and PDF
        env:
          GH_TOKEN: ${{ github.token }}
          CONTAINER: ${{ inputs.container }}
          IMAGE: ${{ steps.ghcr.outputs.image }}
        run: |
          source "containers/$CONTAINER/params.sh"
          tag="openrecon-${toolName}-v${version}"
          gh release create "$tag" \
            "dist/$CONTAINER/"*.zip "dist/$CONTAINER/"*.pdf \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$toolName $version" \
            --notes "Built from commit $GITHUB_SHA. Download the ZIP for scanner installation. For local Docker use: docker pull --platform linux/amd64 $IMAGE"
