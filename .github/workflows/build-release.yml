name: Build OpenRecon release

on:
  workflow_dispatch:
    inputs:
      container:
        description: Container to build
        required: true
        type: choice
        default: bios214-radial
        options:
          - bios214-radial

permissions:
  contents: write

concurrency:
  group: openrecon-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.17'
      - name: Prepare build space and packaging tools
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          df -h /
      - name: Build scanner package
        env:
          CONTAINER: ${{ inputs.container }}
        run: bash package.sh "$CONTAINER"
      - name: Publish ZIP and PDF
        env:
          GH_TOKEN: ${{ github.token }}
          CONTAINER: ${{ inputs.container }}
        run: |
          source "containers/$CONTAINER/params.sh"
          tag="openrecon-${toolName}-v${version}-build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            "dist/$CONTAINER/"*.zip "dist/$CONTAINER/"*.pdf \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$toolName $version (build $GITHUB_RUN_NUMBER)" \
            --notes "Built from commit $GITHUB_SHA. Download the ZIP for scanner installation or local Docker use."
